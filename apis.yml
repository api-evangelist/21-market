description: >-
  21 Market is the API Evangelist network profile for 주식회사 21세기전파상 (21st Century
  Electronics Shop Co., Ltd.), a South Korean consumer-electronics resale company
  that operates the Repercent (리퍼센트) service at repercent.com. Repercent buys used
  smartphones and mobile devices — iPhone, Galaxy, tablets, and laptops — from
  individual sellers, providing instant online price quotes, fast payment, and a
  simple pickup/logistics flow for secondhand device trade-in. The company is a
  500 Global portfolio company and was surfaced into the network as a venture
  portfolio lead. As of this pass the company publishes no public developer
  program, API, or documentation surface; this profile captures verified company
  identity, its live web properties, and probed domain-security posture.
